name: Mobile Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://apex-server-fj0e.onrender.com/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::The GitHub runner does not have the Android command-line tools installed."
            exit 1
          fi
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Firebase Android credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is not configured; continuing without Firebase Android credentials."
          fi

      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured in repository secrets."
            exit 1
          fi
          pnpm exec eas whoami --non-interactive

      - name: Build preview APK locally
        run: |
          mkdir -p artifacts
          pnpm exec eas build \
            --local \
            --non-interactive \
            --freeze-credentials \
            --profile preview \
            --platform android \
            --output ./artifacts/apex-learn-preview.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-learn-preview-apk-${{ github.run_number }}
          path: mobile/artifacts/apex-learn-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated credentials
        if: ${{ always() }}
        run: rm -f google-services.json
